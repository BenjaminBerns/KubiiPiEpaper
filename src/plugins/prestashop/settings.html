<div class="form-group">
    <label for="ps_url" class="form-label">URL de la boutique (ex: https://monsite.com) :</label>
    <input type="url" name="ps_url" id="ps_url" class="form-control" placeholder="https://monsite.com" value="" required>
</div>
<div class="form-group">
    <label for="ps_key" class="form-label">Clé API (Webservice Key) :</label>
    <input type="password" name="ps_key" id="ps_key" class="form-control" value="" required>
</div>
<div class="form-group" style="display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" name="ps_exclude_b2b" id="ps_exclude_b2b" style="margin:0;">
    <label for="ps_exclude_b2b" class="form-label" style="margin:0;">Exclure les commandes d'Entreprises du panier moyen</label>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (pluginSettings) {
            document.getElementById('ps_url').value = pluginSettings.ps_url || '';
            document.getElementById('ps_key').value = pluginSettings.ps_key || '';
            
            if (pluginSettings.ps_exclude_b2b !== undefined) {
                document.getElementById('ps_exclude_b2b').checked = pluginSettings.ps_exclude_b2b === 'on' || pluginSettings.ps_exclude_b2b === true;
            } else {
                document.getElementById('ps_exclude_b2b').checked = true; // Default to true
            }
        } else {
            document.getElementById('ps_exclude_b2b').checked = true;
        }
    });
</script>
