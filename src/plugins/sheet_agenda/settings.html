<div class="form-group">
    <label for="sheetUrl" class="form-label">Lien de la Google Sheet :</label>
    <input type="text" id="sheetUrl" name="sheetUrl" class="form-input" required
           placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=0">
    <span style="color: var(--text-primary);">Partagez la feuille à « Tous les utilisateurs disposant du lien ». L'onglet affiché est celui du lien.</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('sheetUrl').value = pluginSettings.sheetUrl || '';
        }
    });
</script>
